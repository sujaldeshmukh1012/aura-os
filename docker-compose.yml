services:
  postgres:
    image: pgvector/pgvector:pg17
    profiles: ["backend"]
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${NEXUS_POSTGRES_PASSWORD:?set NEXUS_POSTGRES_PASSWORD}
    volumes:
      - nexus_postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  nexus_postgres:
