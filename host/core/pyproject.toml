[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-core"
version = "0.1.0"
description = "Portable local host core for the NEXUS dock"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nexus-host = "nexus_core.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nexus_core*"]
